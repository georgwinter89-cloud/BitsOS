# Kernel target flags (V2-PLAN §2.2): higher-half static link, kernel code model, frame pointers for RB-2's
# backtraces. The linker script is passed by kernel/build.rs.
[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "code-model=kernel",
  "-C", "force-frame-pointers=yes",
  # R10 (x86-64-v3 minimum): the integer v3 instructions everywhere in the kernel. No SSE/AVX codegen:
  # vector registers belong to user programs; kernel SIMD only inside hal's guarded sections.
  "-C", "target-feature=+popcnt,+lzcnt,+bmi1,+bmi2,+movbe,+cmpxchg16b",
]

# bitsboot stays generic x86-64 on purpose: it must run on any CPU to say "processor too old".
[target.x86_64-unknown-uefi]
rustflags = ["-C", "force-frame-pointers=yes"]

[alias]
xtask = "run -q -p xtask --"
