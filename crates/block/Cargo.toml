[package]
name = "block"
version = "0.1.0"
edition = "2024"
description = "Block layer: request queue with merging and B4 priorities, write-refusal hook (R8a), RAM disk (owner: FS)"

[dependencies]
devmodel = { path = "../devmodel" }
# GP-GUARD: the Gaming-PC's disk rule (policy.rs; pure, no dependencies).
gp-platform = { path = "../gp-platform" }
ksync = { path = "../ksync" }
klog = { path = "../klog" }
ktest = { path = "../ktest" }
sched = { path = "../sched" }
uapi = { path = "../uapi" }
vfs = { path = "../vfs" }

[dev-dependencies]
# The spin-lock probe of the ATOMIC-3 tests (a GlobalAlloc front; tests outside src/ may not use unsafe).
mm-core = { path = "../mm-core", features = ["host-count"] }

[lints]
workspace = true
