[package]
name = "amdgpu"
version = "0.1.0"
edition = "2024"
description = "Radeon 780M whole-GPU device object (dcn first) (owner: GX)"

[dependencies]
devmodel = { path = "../../devmodel" }
pci = { path = "../../pci" }
ksync = { path = "../../ksync" }
klog = { path = "../../klog" }
kreg = { path = "../../kreg" }
hal = { path = "../../hal" }
ktest = { path = "../../ktest" }
# GX-2: register names/offsets (generated), the MCP tools (dcn_snapshot, dcn_writes), the GOP framebuffer from
# the BootInfo (kexec keeps it), policy for the ktests' tool context.
dcn314-regs = { path = "../../dcn314-regs" }
mcp = { path = "../../mcp" }
kexec = { path = "../../kexec" }
bootinfo = { path = "../../bootinfo" }
policy = { path = "../../policy" }
# GX-3: the flip engine for gopfb's fbdev (trait, GopFb over A0/A1), the kernel clock and sleeps for the waits.
gopfb = { path = "../gopfb" }
display = { path = "../../display" }
time = { path = "../../time" }
sched = { path = "../../sched" }
# GX-4: the `mode` monitor command (console::command!) and the confirmation prompt on the screen.
console = { path = "../../console" }
# GX-7a: the firmware loader reads the stick's /boot/BITSOS2/firmware through the VFS.
vfs = { path = "../../vfs" }
# GX-7b: the firmware memory map (which carve-out ranges are reserved) and IVRS (the IOMMU's registers).
acpi = { path = "../../acpi" }
# GX-7h: GART entries, PDEs and the table-store traits (pure, GR-owned).
amdgpu-fmt = { path = "../../amdgpu-fmt" }
# GX-7i: rung 3 copies into pinned system pages (MM-14 DmaPages) bound in the GART.
mm = { path = "../../mm" }

[lints]
workspace = true
