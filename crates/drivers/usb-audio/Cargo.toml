[package]
name = "usb-audio"
version = "0.1.0"
edition = "2024"
description = "USB Audio Class 1, and Class 2 through uac2 (owner: SN)"

[dependencies]
usb-core = { path = "../usb-core" }
klog = { path = "../../klog" }
kreg = { path = "../../kreg" }
ksync = { path = "../../ksync" }
ktest = { path = "../../ktest" }
pci = { path = "../../pci" }
sched = { path = "../../sched" }
time = { path = "../../time" }
# GP-SOUND AU-3: the board jacks of the Gaming-PC (UAC2).
uac2 = { path = "../uac2" }
# The profile name, for sn.usb.jacks.
gp-platform = { path = "../../gp-platform" }

[dev-dependencies]
uac2 = { path = "../uac2", features = ["fixture"] }

[lints]
workspace = true
