[package]
name = "drm"
version = "0.1.0"
edition = "2024"
description = "DRM core, amdgpu, sync_file and dma-buf user API types, generated by host/gen/drm (owner: DR)"
publish = false


[dependencies]
# DR-2: the render node (vfs File, devnode!, /sys view), events, locks, the caller's pid and capabilities (proc),
# the hypervisor bit for drm=auto (hal), the ktests (ktest, policy for spawning the ABI program).
vfs = { path = "../vfs" }
klog = { path = "../klog" }
kreg = { path = "../kreg" }
ksync = { path = "../ksync" }
hal = { path = "../hal" }
proc = { path = "../proc" }
policy = { path = "../policy" }
ktest = { path = "../ktest" }
# DR-3: the ktests' signaling and unplugging threads.
sched = { path = "../sched" }
# DR-5: dma-buf mappings (mm::device), DmaPages-backed buffers.
mm = { path = "../mm" }
# DR-5 fixer: managed RAM for udmabuf's ref_limit default.
mm-core = { path = "../mm-core" }
# Linux's errno values; renamed because `crate::uapi` is the generated DRM user API.
linux = { package = "uapi", path = "../uapi" }
# DR-7: the fake GPU builds its client page tables with GR's pure GFX 11 VM core (CPU path).
amdgpu-fmt = { path = "../amdgpu-fmt" }

[lints]
workspace = true
