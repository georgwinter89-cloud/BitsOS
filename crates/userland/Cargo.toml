[package]
name = "userland"
version = "0.1.0"
edition = "2024"
description = "Kernel side of UL's programs: starts and watches /bin/init (PID 1), the DHCP view at /proc/net/dhcp init reads, and the ktests of init, the abi-* programs and stress (owner: UL)"

[dependencies]
net = { path = "../net" }

# Only the bare-metal parts (the supervisor's runtime, the ktests) use these; a host build has the init path, the
# transcript comparison and the DHCP view.
[target.'cfg(target_os = "none")'.dependencies]
proc = { path = "../proc" }
vfs = { path = "../vfs" }
sched = { path = "../sched" }
ksync = { path = "../ksync" }
klog = { path = "../klog" }
ktest = { path = "../ktest" }
policy = { path = "../policy" }
uapi = { path = "../uapi" }
console = { path = "../console" }
display = { path = "../display" }
time = { path = "../time" }

[lints]
workspace = true
