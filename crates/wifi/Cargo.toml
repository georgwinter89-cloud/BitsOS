[package]
name = "wifi"
version = "0.1.0"
edition = "2024"
description = "802.11 station layer independent of the chip: scan list, MLME, RSN, EAPOL 4-way and group key handshakes, PN replay, supervisor (owner: WL)"

# RustCrypto (WL-3 brief: allowed downloads, pinned exactly; listed in plan/notes/WL-3.md)
[dependencies]
sha1 = { version = "=0.10.6", default-features = false, features = ["force-soft"] }
hmac = { version = "=0.12.1", default-features = false }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
aes = { version = "=0.7.5", default-features = false, features = ["force-soft"] }
aes-kw = { version = "=0.1.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

[dev-dependencies]
ccm = { version = "=0.4.3", default-features = false }
wifi = { path = ".", features = ["peer"] }

[features]
default = []
# host tests and fake APs only: the authenticator side of the handshakes (src/peer.rs)
peer = []
