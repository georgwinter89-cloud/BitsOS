<h1>Käsespätzle</h1>
<p>400 g Mehl, 4 Eier, 200 ml Wasser, Salz, Muskat. Teig schlagen, bis er Blasen wirft.</p>
<p>Spätzle ins kochende Wasser schaben, schichtweise mit Bergkäse und Röstzwiebeln in
eine Form geben. Zehn Minuten im Ofen überbacken.</p>
</body></html>
