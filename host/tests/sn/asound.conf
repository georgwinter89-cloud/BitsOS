# BitsOS V2 (SN-9): libasound's conversion plugins (rate, linear, route under "plug") need an mmap-capable
# slave, and V2's hw PCM has no mmap (SN-4: RW_INTERLEAVED, SYNC_PTR). So capture goes plug -> mmap_emul ->
# hw:0,0 (mmap_emul turns the plugins' mmap access into READI). Playback stays plug -> hw:0 as alsa.conf's
# pcm/default.conf makes it (SN-4/SN-7, Cobalt's sink unchanged). Installed as /etc/asound.conf (UL manifest);
# the SN-9 scenario puts it into $HOME/.asoundrc until then.
pcm.!default {
	type asym
	playback.pcm "plug:hw:0"
	capture.pcm "plug:bitsos_capture"
}
pcm.bitsos_capture {
	type mmap_emul
	slave.pcm "hw:0,0"
}
