[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Host build/test tool: build, image, qemu (with refusals), test, fullrun, stick, serve, deps (desk)"

[dependencies]
bootinfo = { path = "../../crates/bootinfo" }
# release-assets packs with the installer's own tar, manifest and VENDOR.txt code, so both read the same format.
bitsos-install = { path = "../installer" }

[dev-dependencies]
# ledger.rs: the ledger's reading of a class against the kernel's rule.
ktest = { path = "../../crates/ktest" }

[lints]
workspace = true
