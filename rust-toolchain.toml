# Pinned by date in CONTRACTS.md ("toolchain"); xtask checks `rustc -V` against it and warns on a mismatch.
# The channel name stays "nightly" so no second toolchain download is needed; the desk bumps the expected
# date once a month in one commit.
[toolchain]
channel = "nightly"
components = ["rust-src", "llvm-tools"]
targets = ["x86_64-unknown-none", "x86_64-unknown-uefi", "x86_64-unknown-linux-musl"]
