# Linux programs for V2 (and CachyOS): stable toolchain, x86_64-unknown-linux-musl, static.
# Owner of the folder layout: desk; programs: UL (and the lanes named in V2-LANES.md §2).
[workspace]
resolver = "3"
members = ["smoke/hello-rs", "init", "tools/usys", "tools/stress", "tools/fetch", "tools/procs", "tools/evtest", "tools/fbtest", "tools/memstress", "tools/alsa-test", "abi-tests", "lib/mcpreg", "services/settingsd", "tools/bitspkg", "tools/bitssnap", "services/bitsjournal"]

[profile.release]
opt-level = 2
debug = false
