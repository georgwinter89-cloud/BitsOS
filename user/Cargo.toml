# Linux programs for V2 (and CachyOS): stable toolchain, x86_64-unknown-linux-musl, static.
# Owner of the folder layout: desk; programs: UL (and the lanes named in V2-LANES.md §2).
[workspace]
resolver = "3"
members = ["smoke/hello-rs", "init", "tools/usys", "tools/stress", "tools/fetch", "tools/procs", "tools/bitsprof", "tools/evtest", "tools/fbtest", "tools/memstress", "tools/blkbench", "abi-tests", "lib/mcpreg", "lib/bitsupdate", "lib/bitsact", "ports/brave/actions", "services/settingsd", "services/assist", "tools/bitspkg", "tools/bitsrun", "tools/bitssnap", "tools/bitsdisk", "tools/gpu-messung", "services/bitsjournal", "services/bitsmusik", "services/bitsbench", "services/bitsmcp", "services/bitsinstall", "services/bitspkgd", "ports/steam/reaper", "lib/steamlib", "lib/uilist", "services/bitsaccess", "lib/bitstree", "tools/bits"]

[profile.release]
opt-level = 2
debug = false
