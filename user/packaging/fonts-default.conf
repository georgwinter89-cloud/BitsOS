<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- GPY: V2's system fontconfig has no alias rules, so with more than one font every unknown or generic family
     (monospace, sans-serif, a missing "Hack") tied and fontconfig took the first file it scanned (DejaVu Sans Mono
     in TTF/). Noto Sans Mono stays the default every name falls back to; named families still find their own file. -->
<fontconfig>
	<match target="pattern">
		<edit name="family" mode="append_last"><string>Noto Sans Mono</string></edit>
	</match>
</fontconfig>
