# BitsOS V2 (BR-2): glibc's name service switch. Only what glibc has built in since 2.34 (files, dns): no
# systemd-resolved, myhostname or mymachines (CachyOS's `resolve` would go to a varlink socket V2 has not got).
passwd: files
group: files
shadow: files
hosts: files dns
networks: files
protocols: files
services: files
ethers: files
rpc: files
netgroup: files
