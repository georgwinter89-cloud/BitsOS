<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LO-1: LibreOffice's fontconfig on BitsOS V2 (FONTCONFIG_FILE, set by \BITSOS2\bin\libreoffice). CachyOS's
     fonts.conf with the tree's paths (@TREE@ = /boot/BITSOS2/libreoffice, filled in by scripts/stage-v2.sh): the
     tree's fonts and rules; the cache in the user's ~/.cache (on the data volume: made once, valid after a reboot,
     since fontconfig checks a FAT directory by its names, not its mtime). LibreOffice adds its own share/fonts. -->
<fontconfig>
	<description>BitsOS V2: LibreOffice's fontconfig</description>
	<dir>@TREE@/fonts</dir>
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<include ignore_missing="yes">@TREE@/etc/fonts/conf.d</include>
	<cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
