[package]
name = "assist"
version = "0.1.0"
edition = "2024"
description = "The native assistant client of BitsOS (CL-3a): console chat with the AI provider Georg chose, tool use through the settings registry"
publish = false

# The same exact pins as user/tools/fetch (spec/rust-ecosystem.md 2.4: rustls 0.23.46 + ring 0.17.14 in user
# space; rustls without default features because aws-lc-rs is not cached and needs cmake).
[dependencies]
# JSON, the six settings tools with their schemas and the R8 guard: one definition for settingsd and the client.
settingsd = { path = "../settingsd" }
# The JSON type settingsd's tool table speaks (no dependencies of its own).
mcpreg = { path = "../../lib/mcpreg" }
# serve (CL-3s): who may speak to the service is the installer's rule for the session's compositor
# (`bitsinstall::judge_peer`, as bitspkgd uses it), and the own uid comes from usys (no unsafe code here).
bitsinstall = { path = "../bitsinstall" }
usys = { path = "../../tools/usys" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
rustls-webpki = { version = "=0.103.15", default-features = false }
ring = { version = "=0.17.14", default-features = false }
# text_suchen (EINS K3): the regular expressions of the native search tool; no dependencies of its own, and
# user/Cargo.lock already locks it (symphonia's).
regex-lite = "=0.1.9"
# termios and the window size of the console (src/term/sys.rs, the crate's only unsafe code).
libc = "=0.2.190"

[lib]
path = "src/lib.rs"

[[bin]]
name = "assist"
path = "src/main.rs"
