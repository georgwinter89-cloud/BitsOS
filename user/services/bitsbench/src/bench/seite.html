<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>BitsOS Nacht-Messung</title>
<style>
body{margin:0;font:16px/1.5 sans-serif;background:#10141a;color:#d8e0e8}
header{position:sticky;top:0;padding:12px 24px;background:#1b222b;border-bottom:1px solid #2c3640}
section{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:24px}
article{padding:16px;border-radius:12px;background:linear-gradient(135deg,#1e2833,#253240);box-shadow:0 4px 12px #0008}
article h2{margin:0 0 8px;font-size:18px;color:#7fcfa0}
canvas{width:100%;height:80px;display:block}
</style></head>
<body><header>Nacht-Messung: eine Seite nur für die Messung, sie lädt nichts aus dem Netz.</header>
<section id="s"></section>
<script>
const s=document.getElementById('s');
for(let i=0;i<240;i++){
  const a=document.createElement('article');
  a.innerHTML='<h2>Karte '+(i+1)+'</h2><p>'+'Ein Absatz Text, damit es beim Scrollen etwas zu zeichnen gibt. '.repeat(1+i%4)+'</p><canvas></canvas>';
  s.appendChild(a);
  const c=a.querySelector('canvas'),g=c.getContext('2d');c.width=400;c.height=80;
  for(let x=0;x<400;x+=4){g.fillStyle='hsl('+((x+i*17)%360)+',50%,55%)';g.fillRect(x,40-30*Math.sin((x+i)/23),3,30*Math.sin((x+i)/23)+40);}
}
</script></body></html>
