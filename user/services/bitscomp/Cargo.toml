[package]
name = "bitscomp"
version = "0.1.0"
edition = "2024"
description = "BitsOS Wayland compositor: draws on the GPU with GLES through the Mesa tree"
publish = false

# Own workspace: built on its own by `cargo xtask image` through the manifest's `cargo:` source (the stick's
# \BITSOS2\bin\bitscomp, linked against the Mesa tree's glibc: build.rs) and by the gate's host tests; the user/
# workspace manifest stays untouched.
[workspace]

# Exact pins (licences: plan/spec/bitscomp.md §1; downloads covered by Georg's OK).
[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_gl"] }
# WY-5b's settings page (`bitscomp page`, a placeholder window whose content bitscomp draws itself) speaks the
# protocol in pure Rust.
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
calloop = { version = "=0.14.5", features = ["signals"] }
# WY-1a: fbdev/evdev/KD/timerfd ioctls (already in the lock through Smithay's dependencies; no new download).
libc = "=0.2.191"
# WY-4: MC-6's client library (path dependency, no crates): the MCP tools windows and window_kill.
mcpreg = { path = "../../lib/mcpreg" }
# GM-6b: Steam's installed games for the library's fourth source (GM-6s; path dependency, no crates).
steamlib = { path = "../../lib/steamlib" }
# DB1: the desktop as a list (contract C1 types; path dependency). serde_json for the lists and the C3/C4 lines
# (pins as uilist's and ctxd's, in the cargo cache already).
uilist = { path = "../../lib/uilist" }
serde_json = "=1.0.154"
# EINS-D: whether a control socket peer is in the assistant's tree (PLAN K5; path dependency, std only).
bitstree = { path = "../../lib/bitstree" }

# WY-5: Exo 2 for the interface, grey-level antialiased (plan/spec/rust-ecosystem.md §2.5 names it). std instead of
# hashbrown (no extra crate); its one dependency ttf-parser 0.25.1 was already in the cargo cache.
fontdue = { version = "=0.9.5", default-features = false, features = ["std", "simd"] }
# WY-11: Xcursor theme files (Adwaita), in the local cargo cache; no dependencies of its own.
xcursor = "=0.3.11"
# PK-L1a: the library's PNG icons, inflated by miniz_oxide (in user/Cargo.lock and the root lock already; the decoder
# itself is bitscomp's icon_png.rs: plan/spec/rust-ecosystem.md names neither png nor resvg).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = 3
debug = 1
