[package]
name = "bitsmcp"
version = "0.1.0"
edition = "2024"
description = "BitsOS MCP as a user-space service (MC-8a/8b): HTTP/1.1 + JSON-RPC over mutual TLS after a one-time pairing, the kernel reached only through /dev/bitsos/mcp"
publish = false

# mcp-wire: the kernel server's own protocol code (HTTP head, JSON, JSON-RPC answers, the gate), so both answer
# alike. libc: setresuid/setgroups, prctl and seccomp(2) in src/sys.rs (the pin already in user/Cargo.lock, no
# new download).
[dependencies]
mcp-wire = { path = "../../../crates/mcp-wire" }
libc = "=0.2.190"
# MC-8b: mutual TLS 1.3 with pinned self-signed keys (spec/rust-ecosystem.md 2.4: rustls + ring in user space).
# The same exact versions as user/tools/fetch (already in the cargo cache and user/Cargo.lock, no download);
# rustls without default features because its default provider aws-lc-rs is not cached and needs cmake.
# Licences: rustls Apache-2.0 OR ISC OR MIT, ring Apache-2.0 AND ISC, rustls-webpki ISC, rustls-pki-types MIT OR Apache-2.0.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
rustls-webpki = { version = "=0.103.15", default-features = false }
ring = { version = "=0.17.14", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitsmcp"
path = "src/main.rs"
