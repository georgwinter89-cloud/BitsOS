[package]
name = "fetch"
version = "0.1.0"
edition = "2024"
description = "HTTPS/HTTP GET into a file with progress, SHA-256 and exit codes for scripts (UL-4a)"

# Exact versions from the local cargo cache (spec/rust-ecosystem.md 2.4: rustls 0.23.46 + ring 0.17.14 in user space).
# rustls without default features: its default provider aws-lc-rs is not cached and needs cmake.
[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Pinned through rustls; named so the versions stay exact (rustls-pki-types brings the PEM parser).
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
rustls-webpki = { version = "=0.103.15", default-features = false }
ring = { version = "=0.17.14", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
